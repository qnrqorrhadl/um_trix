    /* 레이아웃: 화면 가운데에 양옆 벽이 있는 좁은 판, 위쪽에 얇은 조작 막대 하나 */
  :root {
    --bg: #14161c;
    --fg: #e8eaf0;
    --muted: #8a90a0;
    --line: #2a2e3a;
    --accent: #ffd23f;
    --accent-ink: #14161c;
    --font-display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-body: "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: manipulation;
  }
  #bar {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding-top: 12px;
    pointer-events: none;
  }
  #bar > * { pointer-events: auto; }
  #hint {
    flex: 1 1 240px;
    min-width: 0;
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
  }
  kbd {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    color: var(--fg);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
  }
  .btns { display: flex; gap: 8px; align-items: center; }
  button {
    font: 700 14px var(--font-body);
    min-height: 40px;
    padding: 0 16px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #score {
    font: 700 18px var(--font-body);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 4.5em;
    text-align: right;
  }</style>
</head>

</script>
<script>
const CHARS = ["엄", "승", "식"];
const COLORS = ["#ff5d73", "#ffd23f", "#3ddc97", "#4cc9f0"];   // 글자 색 4가지
const COLS = 9;               // 판 너비 = 글자 9개
const POINTS = 100;           // 한 번 사라질 때 점수
const MAX = 200;              // 화면 위 글자 최대 개수
const FONT = '"Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const { Engine, Bodies, Body, Composite, Sleeping } = Matter;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const barEl = document.getElementById("bar");

let W = 0, H = 0, dpr = 1, s = 48, BL = 0, BR = 0;
let engine, letters, particles, floats, clearing, score, over, ending, frame;
const FLASH_FRAMES = 54;      // 흰색 깜빡임 3번 (한 번 18프레임)

function init() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  s = Math.max(19, Math.min(37, Math.floor((W - 40) / COLS)));   // 글자 한 칸 크기
  BL = Math.round((W - s * COLS) / 2);                            // 왼쪽 벽 x
  BR = BL + s * COLS;                                             // 오른쪽 벽 x

  engine = Engine.create({
    enableSleeping: true,
    positionIterations: 30,     // 물리 계산을 더 촘촘히 해서 아래 글자가 겹치지 않게
    velocityIterations: 16,
    constraintIterations: 4
  });
  engine.gravity.y = 1.4;
  letters = [];
  particles = [];
  floats = [];
  clearing = [];
  score = 0;
  over = false;
  ending = false;     // 가득 찼을 때 위에서부터 사라지는 중
  frame = 0;

  const t = 300;
  Composite.add(engine.world, [
    Bodies.rectangle((BL + BR) / 2, H + t / 2, s * COLS + t * 2, t, { isStatic: true, friction: 0.8 }),
    Bodies.rectangle(BL - t / 2, -H, t, H * 4, { isStatic: true, friction: 0.2 }),
    Bodies.rectangle(BR + t / 2, -H, t, H * 4, { isStatic: true, friction: 0.2 })
  ]);
  updateScore();
}

function updateScore() { scoreEl.textContent = score + "점"; }

function spawnOne(ch, x, c) {
  const body = Bodies.rectangle(x, -s, s * 0.96, s * 0.96, {
    chamfer: { radius: s * 0.12 },
    restitution: 0.05,
    slop: 0.02,                 // 겹침 허용치를 줄임
    friction: 0.5,
    frictionStatic: 0.6,
    frictionAir: 0.01,
    angle: (Math.random() - 0.5) * 0.4
  });
  Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.05);
  body.glyph = {
    ch,
    c
  };
  body.born = frame;
  Composite.add(engine.world, body);
  letters.push(body);
}

// 스페이스바 한 번에 엄·승·식 세 글자가 한 줄로 함께 떨어짐 (색은 한 번에 하나)
function spawn() {
  if (over || ending || letters.length + CHARS.length > MAX) return;
  const x0 = BL + s / 2 + 2 + Math.random() * (s * (COLS - CHARS.length) - 4);
  const c = Math.floor(Math.random() * COLORS.length);   // 세 글자는 같은 색
  CHARS.forEach((ch, i) => spawnOne(ch, x0 + i * s, c));
}

// 거의 멈춰 있는 글자만 줄 판정에 사용
function isStill(b) {
  if (b.flashing) return false;
  if (b.isSleeping) return true;
  return frame - b.born > 30 && b.speed < 0.25 && Math.abs(b.angularSpeed) < 0.01;
}

// 같은 색 글자가 서로 맞닿아 왼쪽 벽 ~ 오른쪽 벽까지 이어진 길을 찾음
function findPath() {
  const still = letters.filter(isStill);
  const tol = s * 0.15;       // 벽에 닿았다고 보는 오차
  const reach = s * 1.2;      // 글자끼리 맞닿았다고 보는 중심 거리
  for (let c = 0; c < COLORS.length; c++) {
    const g = still.filter((b) => b.glyph.c === c);
    if (g.length < COLS - 1) continue;
    const prev = new Map();
    const queue = [];
    for (const b of g) {
      if (b.bounds.min.x <= BL + tol) { prev.set(b, null); queue.push(b); }
    }
    for (let i = 0; i < queue.length; i++) {
      const a = queue[i];
      if (a.bounds.max.x >= BR - tol) {
        const path = [];
        for (let n = a; n; n = prev.get(n)) path.push(n);
        return path;
      }
      for (const b of g) {
        if (prev.has(b)) continue;
        if (Math.hypot(a.position.x - b.position.x, a.position.y - b.position.y) <= reach) {
          prev.set(b, a);
          queue.push(b);
        }
      }
    }
  }
  return null;
}

// 줄이 맞으면 먼저 제자리에 고정해서 흰색으로 3번 깜빡인 뒤 사라짐
function clearPath(path) {
  for (const b of path) {
    b.flashing = true;
    b.flashStart = frame;
    Body.setStatic(b, true);
  }
  clearing.push(path);
}

function finishClear(path) {
  let cx = 0, cy = 0;
  for (const b of path) {
    cx += b.position.x; cy += b.position.y;
    for (let i = 0; i < 18; i++) {      // 모래처럼 흩어지는 알갱이
      particles.push({
        x: b.position.x + (Math.random() - 0.5) * s,
        y: b.position.y + (Math.random() - 0.5) * s,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 3,
        life: 30 + Math.random() * 30,
        color: COLORS[b.glyph.c]
      });
    }
    Composite.remove(engine.world, b);
    letters.splice(letters.indexOf(b), 1);
  }
  floats.push({ x: cx / path.length, y: cy / path.length, life: 60 });
  score += POINTS;
  updateScore();
  for (const b of letters) Sleeping.set(b, false);   // 빈자리로 글자들이 무너져 내림
}

function burst(b) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: b.position.x + (Math.random() - 0.5) * s,
      y: b.position.y + (Math.random() - 0.5) * s,
      vx: (Math.random() - 0.5) * 3,
      vy: -Math.random() * 3,
      life: 25 + Math.random() * 25,
      color: COLORS[b.glyph.c]
    });
  }
}

// 가득 찼을 때: 가장 위에 있는 한 줄씩 흩어지며 사라지고, 다 사라지면 GAME OVER
function dissolveTop() {
  if (letters.length === 0) { ending = false; over = true; return; }
  let minY = Infinity;
  for (const b of letters) if (b.position.y < minY) minY = b.position.y;
  for (let i = letters.length - 1; i >= 0; i--) {
    const b = letters[i];
    if (b.position.y <= minY + s * 0.6) {
      burst(b);
      Composite.remove(engine.world, b);
      letters.splice(i, 1);
    }
  }
}

function roundRectPath(x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  else { ctx.beginPath(); ctx.rect(x, y, w, h); }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 판 바탕과 양옆 벽
  ctx.fillStyle = "rgba(255,255,255,0.03)";
  ctx.fillRect(BL, 0, BR - BL, H);
  ctx.fillStyle = "#3a3f50";
  ctx.fillRect(BL - 4, 0, 4, H);
  ctx.fillRect(BR, 0, 4, H);

  // 글자
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = Math.round(s * 0.74) + "px " + FONT;
  for (const b of letters) {
    const flashWhite = b.flashing && Math.floor((frame - b.flashStart) / 9) % 2 === 1;
    const col = flashWhite ? "#ffffff" : COLORS[b.glyph.c];
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    const half = s * 0.48;
    roundRectPath(-half, -half, half * 2, half * 2, s * 0.12);
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = col;
    ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.fillText(b.glyph.ch, 0, 1);
    ctx.restore();
  }

  // 흩어지는 알갱이
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;

  // +100 표시
  ctx.font = "26px " + FONT;
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 0.8; f.life--;
    if (f.life <= 0) { floats.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, f.life / 20);
    ctx.fillStyle = "#ffd23f";
    ctx.fillText("+" + POINTS, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(20,22,28,0.72)";
    ctx.fillRect(BL, 0, BR - BL, H);
    ctx.fillStyle = "#e8eaf0";
    ctx.font = "34px " + FONT;
    ctx.fillText("GAME OVER", (BL + BR) / 2, H / 2 - 30);
    ctx.fillStyle = "#8a90a0";
    ctx.font = "700 15px " + FONT;
    ctx.fillText("점수 " + score + "점", (BL + BR) / 2, H / 2 + 6);
    ctx.fillText("R 키 또는 초기화로 다시 시작", (BL + BR) / 2, H / 2 + 32);
  }
}

function loop() {
  frame++;
  Engine.update(engine, 1000 / 120);   // 한 프레임을 두 번으로 쪼개서 계산
  Engine.update(engine, 1000 / 120);
  for (let i = clearing.length - 1; i >= 0; i--) {
    const path = clearing[i];
    if (frame - path[0].flashStart >= FLASH_FRAMES) {
      clearing.splice(i, 1);
      finishClear(path);
    }
  }
  if (!over && !ending && frame % 5 === 0) {
    let path, guard = 0;
    while (guard++ < 3 && (path = findPath())) clearPath(path);
    const limit = barEl.getBoundingClientRect().bottom + 4;
    if (letters.some((b) => b.isSleeping && b.bounds.min.y < limit)) {
      ending = true;
      clearing = [];
    }
  }
  if (ending && frame % 4 === 0) dissolveTop();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (!e.repeat) spawn();
  } else if (e.key === "r" || e.key === "R" || e.key === "ㄱ") {
    init();
  }
});
window.addEventListener("keyup", (e) => { if (e.code === "Space") e.preventDefault(); });
canvas.addEventListener("pointerdown", spawn);
document.getElementById("drop").addEventListener("click", spawn);
document.getElementById("reset").addEventListener("click", init);
window.addEventListener("resize", init);

init();
const start = () => loop();
if (document.fonts && document.fonts.load) {
  document.fonts.load('40px "Black Han Sans"', CHARS.join("")).then(start, start);
} else {
  start();
}
</script>
